name: Apply return-preservation integration

on:
  push:
    branches: [feat/dynamic-relative-risk-ownership]
    paths:
      - .github/workflows/apply-return-preservation.yml
      - research/transport/return-preservation.patch.gz

permissions:
  contents: write

concurrency:
  group: apply-return-preservation-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src:tests:.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Verify transport identity and apply exact integration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2c12e5cf66c25bee0e1e83cd81020ef641a0f731"
          echo "8074d6b2df248c3cf5bf5c96fdeef5ef1274a1cde0bb2fb3756ce1ab56583d19  research/transport/return-preservation.patch.gz" | sha256sum -c -
          gzip -dc research/transport/return-preservation.patch.gz > "$RUNNER_TEMP/return-preservation.patch"
          echo "76557e97f347c3eaaf5de75ef9ae06e3b39f6b83184fa8855b5b3c649739812c  $RUNNER_TEMP/return-preservation.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/return-preservation.patch"
          git apply "$RUNNER_TEMP/return-preservation.patch"
          git rm -- .github/workflows/apply-return-preservation.yml research/transport/return-preservation.patch.gz
          git diff --check

      - name: Verify integrated behavior
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python -m compileall -q src research tests
          TERM=dumb python -m techquant --help >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path("research/risk_ownership_screen_contract.json").read_text())
          assert contract["schema_version"] == 4
          assert contract["parameters"]["core_fraction"] == [0.9]
          assert contract["measurement_status"] == "PENDING_EXACT_SOURCE_REMEASUREMENT"
          PY

      - name: Commit clean integrated source
        run: |
          set -euo pipefail
          git config user.name "quant structural research"
          git config user.email "quant-research@users.noreply.github.com"
          git add -- \
            src/techquant/policy.py \
            src/techquant/engine.py \
            src/techquant/risk_ownership.py \
            src/techquant/cli.py \
            tests/test_risk_ownership.py \
            tests/test_ownership_intent.py \
            tests/test_fill_materiality.py \
            research/risk_ownership_screen.py \
            research/risk_ownership_screen_contract.json
          git commit -m "Reduce false protection while preserving drawdown"
          for attempt in 1 2 3; do
            if git push origin HEAD:feat/dynamic-relative-risk-ownership; then
              remote="$(git ls-remote origin refs/heads/feat/dynamic-relative-risk-ownership | cut -f1)"
              test "$remote" = "$(git rev-parse HEAD)"
              exit 0
            fi
            git fetch origin feat/dynamic-relative-risk-ownership
            git rebase FETCH_HEAD
          done
          exit 1
