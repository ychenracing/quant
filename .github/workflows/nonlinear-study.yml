              for path, expected_hash in request.get('source_sha256', {}).items():
                  if hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != expected_hash:
                      raise ValueError('requested source bytes differ: '+path)
              issued = None
              if request['family'] in {'coherent', 'risk_reliability'}:
                  from research.issued_forecasts import retrieve
                  issued = retrieve(root / 'issued-evidence')
              study_type = Study
              if request['family'] == 'relative_leadership':
                  from research.relative_leadership_study import Study as study_type
              elif request['family'] == 'campaign_payoff':
                  from research.campaign_payoff_study import Study as study_type
              elif request['family'] == 'joint_funding':
                  from research.joint_funding_study import Study as study_type
              operation = request.get('operation', 'measure')
              study = None
              if operation != 'offensive_core_pair':
                  study = study_type(request['family'], issued_evidence=issued)
                  if len(study.module.grid()) != request['candidate_count']:
                      raise ValueError('declared candidate count mismatch')
              data, supplement = inputs(root / 'frozen-input')
              catalog = json.loads(pathlib.Path('research/catalog.json').read_text())
              market = load_market(data, supplement=supplement, sectors=catalog['sectors'])
