name: Forecast ownership evidence
on:
  push:
    branches: [research/expectation-learning]
    paths:
      - .github/workflows/nonlinear-study.yml
      - research/nonlinear-request.json
permissions:
  contents: write
concurrency:
  group: nonlinear-expectation-study
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src:tests:.
      QUANT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact source before validation
        run: |
          mkdir -p "$RUNNER_TEMP/nonlinear"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/nonlinear/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/nonlinear/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/nonlinear/source-tree.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install frozen research runtime
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 -r research/requirements.txt
      - name: Verify offline and forecast ownership contracts
        run: |
          python -m unittest discover -s tests -q > "$RUNNER_TEMP/nonlinear/correctness.txt" 2>&1
          python -m unittest discover -s research -p 'test_*.py' -v >> "$RUNNER_TEMP/nonlinear/correctness.txt" 2>&1
      - name: Measure only the requested registered family
        timeout-minutes: 6
        run: |
          python - <<'PY' > "$RUNNER_TEMP/nonlinear/execution.txt" 2>&1
          import hashlib, json, os, pathlib, traceback
          from research.hosted_study import inputs
          from research.finite_study import Study
          from research.forecast_diagnostics import retrieve_parent, diagnose
          from techquant.data import load_market
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = root / 'nonlinear'
          try:
              request = json.loads(pathlib.Path('research/nonlinear-request.json').read_text())
              for path, expected_hash in request.get('source_sha256', {}).items():
                  if hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != expected_hash:
                      raise ValueError('requested source bytes differ: '+path)
              issued = None
              if request['family'] in {'coherent', 'risk_reliability'}:
                  from research.issued_forecasts import retrieve
                  issued = retrieve(root / 'issued-evidence')
              study_type = Study
              if request['family'] == 'relative_leadership':
                  from research.relative_leadership_study import Study as study_type
              elif request['family'] == 'campaign_payoff':
                  from research.campaign_payoff_study import Study as study_type
              elif request['family'] == 'joint_funding':
                  from research.joint_funding_study import Study as study_type
              study = study_type(request['family'], issued_evidence=issued)
              if len(study.module.grid()) != request['candidate_count']:
                  raise ValueError('declared candidate count mismatch')
              data, supplement = inputs(root / 'frozen-input')
              catalog = json.loads(pathlib.Path('research/catalog.json').read_text())
              market = load_market(data, supplement=supplement, sectors=catalog['sectors'])
              if market.fingerprint() != request['data_sha256']:
                  raise ValueError('frozen market identity mismatch')
              operation = request.get('operation', 'measure')
              if operation == 'continuation_account_audit':
                  if request['family'] != 'joint_funding':
                      raise ValueError('recorded account audit requires the declared research route')
                  from research.continuation_account_audit import review
                  review(output, data, supplement)
              elif operation == 'relative_leadership_evidence_audit':
                  if request['family'] != 'relative_leadership':
                      raise ValueError('read-only audit requires its recorded family')
                  from research.relative_leadership_audit import review
                  review(output, data, supplement)
              elif operation == 'funded_projection_audit':
                  if request['family'] != 'funded_risk':
                      raise ValueError('projection audit requires the funded-risk family')
                  from research.funded_projection_audit import hosted
                  hosted(output, data, supplement)
              elif operation == 'decision_review_pair':
                  if request['family'] != 'healthy_hold_funding':
                      raise ValueError('decision review requires its registered paired family')
                  from research.decision_review import hosted as review_pair
                  review_pair(output, data, supplement)
              elif operation == 'opportunity_allocation_pair':
                  if request['family'] != 'opportunity_allocation':
                      raise ValueError('opportunity allocation requires its registered paired family')
                  from research.opportunity_allocation_study import paired
                  paired(output, data, supplement)
              elif operation == 'continuity_selection_pair':
                  if request['family'] != 'continuity_selection':
                      raise ValueError('continuity selection requires its registered paired family')
                  from research.opportunity_allocation_study import paired
                  paired(output, data, supplement, family='continuity_selection')
              elif operation == 'measure':
                  try:
                      if request['family'] == 'observed_readiness':
                          from research.quantity_gap import hosted as attribute_quantity
                          attribute_quantity(output, data, supplement)
                      elif request['family'] == 'funded_reentry':
                          from research.reentry_diagnosis import hosted as diagnose_reentry
                          diagnose_reentry(output, data, supplement)
                      elif request['family'] == 'suspended_campaign':
                          from research.suspension_diagnosis import hosted as diagnose_suspension
                          diagnose_suspension(output, data, supplement)
                      elif request['family'] == 'admission_structure':
                          from research.admission_geometry import hosted as observe_admissions
                          observe_admissions(output, data, supplement)
                      elif request['family'] == 'protected_retention':
                          from research.retention_diagnosis import hosted as observe_reductions
                          observe_reductions(output, data, supplement)
                      elif request['family'] in {'revocable_reentry', 'allocation_auction', 'relative_leadership', 'campaign_payoff', 'joint_funding'}:
                          # Its exact parent archive and state witnesses are already preserved.
                          pass
                      elif issued is not None:
                          from research.admission_attribution import admission_attribution
                          admission_attribution(issued, market, output / 'parent_diagnosis')
                      else:
                          parent = retrieve_parent(root / 'parent-evidence')
                          diagnose(parent, market, output / 'parent_diagnosis')
                  except Exception:
                      (output / 'parent_diagnosis_failure.json').write_text(json.dumps({'status':'DIAGNOSTIC_RESTORE_FAILED','traceback':traceback.format_exc()},indent=2))
                  study.select(market, catalog, output / 'selection')
                  study.evaluate(market, catalog, output / 'selection/selection.json', output / 'evaluation')
              else:
                  raise ValueError('unknown registered research operation')
          except Exception:
              (output / 'failure.json').write_text(json.dumps({'status': 'FAILED', 'traceback': traceback.format_exc()},indent=2))
              raise
          PY
      - name: Package every outcome without claiming acceptance
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = root / 'nonlinear'
          output.mkdir(exist_ok=True)
          request = json.loads(pathlib.Path('research/nonlinear-request.json').read_text())
          selection = output / 'selection/selection.json'
          selected = json.loads(selection.read_text()) if selection.exists() else {}
          audit_only = request.get('operation') in {'funded_projection_audit', 'relative_leadership_evidence_audit', 'continuation_account_audit'}
          receipt = {'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'family': request['family'], 'operation': request.get('operation', 'measure'),
                     'selection_status': 'NOT_APPLICABLE_DIAGNOSTIC' if audit_only else selected.get('status', 'INCOMPLETE'),
                     'economic_acceptance': 'NOT_PASSED' if selected.get('worst_deficit', 0) > 1e-12 else 'UNVERIFIED',
                     'evaluation_present': (output / 'evaluation/status.json').exists()}
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          manifest = {str(p.relative_to(output)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(output.rglob('*')) if p.is_file() and p.name != 'MANIFEST.json'}
          (output / 'MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n')
          archive = root / 'nonlinear-evidence.tar.gz'
          with tarfile.open(archive, 'w:gz') as bundle:
              bundle.add(output, arcname='nonlinear')
          (root / 'nonlinear-evidence.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  nonlinear-evidence.tar.gz\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonlinear-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nonlinear-evidence.tar.gz
            ${{ runner.temp }}/nonlinear-evidence.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Append and read back immutable evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/nonlinear-evidence.tar.gz"
          gh auth setup-git
          git clone --depth=1 --branch research/evidence "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/evidence-store"
          cd "$RUNNER_TEMP/evidence-store"
          destination="nonlinear/$GITHUB_SHA/$GITHUB_RUN_ID"
          test ! -e "$destination"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/nonlinear-evidence.tar.gz" "$RUNNER_TEMP/nonlinear-evidence.sha256" "$destination/"
          for file in receipt.json failure.json MANIFEST.json correctness.txt parent_diagnosis_failure.json evaluation-decision.json; do
            if [ -f "$RUNNER_TEMP/nonlinear/$file" ]; then cp "$RUNNER_TEMP/nonlinear/$file" "$destination/"; fi
          done
          for dir in account_review selection evaluation parent_diagnosis projection_audit quantity_gap reentry_diagnosis suspension_diagnosis holding_diagnosis admission_diagnosis retention_diagnosis decision_review; do
            if [ -d "$RUNNER_TEMP/nonlinear/$dir" ]; then
              mkdir -p "$destination/$dir"
              find "$RUNNER_TEMP/nonlinear/$dir" -maxdepth 1 -type f -exec cp {} "$destination/$dir/" \;
            fi
          done
          git config user.name 'quant research publisher'
          git config user.email 'quant-research@users.noreply.github.com'
          git add -- "$destination"
          git commit -m 'research: retain requested ownership source, issued forecasts and complete outcomes'
          for attempt in 1 2 3; do
            if git push origin HEAD:research/evidence; then
              git fetch origin research/evidence
              expected=$(cut -d' ' -f1 "$RUNNER_TEMP/nonlinear-evidence.sha256")
              actual=$(git show "FETCH_HEAD:$destination/nonlinear-evidence.tar.gz" | sha256sum | cut -d' ' -f1)
              test "$actual" = "$expected"
              printf '%s\n' "Read-back verified $destination $actual" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git fetch origin research/evidence
            git rebase FETCH_HEAD
          done
          exit 1
