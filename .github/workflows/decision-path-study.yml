name: Independent decision path evidence
on:
  push:
    branches: [research/expectation-learning]
    paths:
      - .github/workflows/decision-path-study.yml
      - research/decision-path-request.json
permissions:
  contents: write
concurrency:
  group: decision-path-study
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src:tests:.
      QUANT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Verify affected correctness
        run: python -m unittest test_core test_inventory_intent test_inventory_adapter test_ledger_attribution test_decision_paths -v > "$RUNNER_TEMP/correctness.txt" 2>&1
      - name: Measure declared candidates with exact shared shadows
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          from research.hosted_study import inputs
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          data, supplement = inputs(root / 'frozen-input')
          with (root / 'decision-path-execution.txt').open('w') as log:
              subprocess.run([sys.executable, '-m', 'research.decision_path_study', '--data', str(data),
                  '--supplement', str(supplement), '--output', str(root / 'decision-paths')],
                  stdout=log, stderr=subprocess.STDOUT, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-paths-${{ github.sha }}
          path: |
            ${{ runner.temp }}/decision-paths/
            ${{ runner.temp }}/decision-paths.tar.gz
            ${{ runner.temp }}/decision-paths.tar.gz.sha256
            ${{ runner.temp }}/decision-path-execution.txt
            ${{ runner.temp }}/correctness.txt
          retention-days: 90
          if-no-files-found: error
      - name: Append complete raw evidence without replacing parallel work
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/decision-paths.tar.gz"
          gh auth setup-git
          git clone --depth=1 --branch research/evidence "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/evidence-store"
          cd "$RUNNER_TEMP/evidence-store"
          destination="decision-paths/$GITHUB_SHA/$GITHUB_RUN_ID"
          test ! -e "$destination"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/decision-paths.tar.gz" "$RUNNER_TEMP/decision-paths.tar.gz.sha256" "$destination/"
          cp "$RUNNER_TEMP/correctness.txt" "$RUNNER_TEMP/decision-path-execution.txt" "$destination/"
          for file in status.json failure.json MANIFEST.json execution.json; do
            if [ -f "$RUNNER_TEMP/decision-paths/$file" ]; then cp "$RUNNER_TEMP/decision-paths/$file" "$destination/"; fi
          done
          for dir in selection evaluation; do
            if [ -d "$RUNNER_TEMP/decision-paths/$dir" ]; then
              mkdir -p "$destination/$dir"
              find "$RUNNER_TEMP/decision-paths/$dir" -maxdepth 1 -type f -exec cp {} "$destination/$dir/" \;
            fi
          done
          git config user.name 'quant research publisher'
          git config user.email 'quant-research@users.noreply.github.com'
          git add -- "$destination"
          git commit -m 'research: retain path-selection trials, scores and actual fills'
          for attempt in 1 2 3; do
            if git push origin HEAD:research/evidence; then
              remote=$(git ls-remote origin refs/heads/research/evidence | cut -f1)
              test "$remote" = "$(git rev-parse HEAD)"
              exit 0
            fi
            git fetch origin research/evidence
            git rebase FETCH_HEAD
          done
          exit 1
