name: Offline correctness
on:
  push:
    branches: [main, research/expectation-learning]
    paths-ignore:
      - research/results/**
      - research/EXPECTATION_WORK.md
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve exact source
        run: |
          mkdir -p verification
          git archive --format=zip HEAD > verification/source.zip
          git rev-parse HEAD > verification/source-sha.txt
          git rev-parse 'HEAD^{tree}' > verification/source-tree.txt
          python --version > verification/environment.txt
      - run: python -m pip install -e .
      - name: Offline tests
        run: python -m unittest discover -s tests -v 2>&1 | tee verification/tests.txt
      - run: python -m compileall -q src research
      - run: python -m techquant --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-source-verification
          path: verification/
          retention-days: 30
          if-no-files-found: error
