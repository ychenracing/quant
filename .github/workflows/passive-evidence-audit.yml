name: Passive evidence audit inputs
on:
  push:
    branches: [research/expectation-learning]
    paths: [.github/workflows/passive-evidence-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Recover existing reference evidence with object checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reference-audit-inputs'
          root.mkdir()
          repo = os.environ['GITHUB_REPOSITORY']
          ref = '3aecdca64395b01204b36933180c2a10e504e4f6'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/' + path]))
          tree = api('git/trees/' + ref + '?recursive=1')
          assert not tree['truncated']
          selected = [x for x in tree['tree'] if x['type'] == 'blob' and (
              x['path'].startswith('renewed-continuation/native-execution/') or
              x['path'] in ['renewed-continuation/progress.json', 'renewed-continuation/PRIOR_HANDOFF.md',
                  'published/bbc002449093e458868a8748687df023958ba283/local-native/verification.json'])]
          assert sum(x['size'] for x in selected) < 1000000
          ledger = []
          for entry in selected:
              assert entry['size'] < 100000
              obj = api('git/blobs/' + entry['sha'])
              assert obj['encoding'] == 'base64'
              raw = base64.b64decode(obj['content'])
              assert len(raw) == entry['size']
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == entry['sha']
              dest = root / entry['path']; dest.parent.mkdir(parents=True, exist_ok=True); dest.write_bytes(raw)
              ledger.append(dict(path=entry['path'], git_blob=actual, bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest()))
          (root / 'receipt.json').write_text(json.dumps(dict(evidence_commit=ref, files=ledger), indent=2) + '\n')
          print('Recovered and verified', len(ledger), 'bounded reference evidence files')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-audit-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/reference-audit-inputs/
          retention-days: 90
          if-no-files-found: error
