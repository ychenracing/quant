name: Passive evidence audit inputs
on:
  push:
    branches: [research/expectation-learning]
    paths: [.github/workflows/passive-evidence-audit.yml]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Recover source without fetching evidence blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/passive-audit-inputs"
          mkdir -p "$out"
          source=4335d3d7e57585a6b80f024f7f60e9b1b41fc10f
          formal=a0705156e82c083f580aa4ebfe52383f5dffdb8d
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          git ls-tree -r -l HEAD > "$out/source-tree.txt"
          git cat-file commit HEAD > "$out/source-commit.txt"
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$source?recursive=1" > "$out/frozen-source-tree.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$formal...$source" --jq '{status,files:[.files[]|select(.filename|test("^(src/|pyproject|research/(requirements|catalog|protocol|fresh_challenger_formal))"))]}' > "$out/formal-to-passive.json"
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '[.[]|{name,sha:.commit.sha,protected}]' > "$out/refs.json"
          evidence=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/research/evidence" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$evidence?recursive=1" > "$out/evidence-tree.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/1/comments?per_page=100" --jq '.[] | {id,created_at,updated_at,body}' > "$out/pr-comments.jsonl"
          gh api "repos/$GITHUB_REPOSITORY/pulls/1" --jq '{number,state,draft,merged,mergeable,mergeable_state,head:.head.sha,base:.base.sha}' > "$out/pr.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=30" --jq '[.workflow_runs[] | {id,name,head_sha,status,run_attempt}]' > "$out/running.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=30" --jq '[.workflow_runs[] | {id,name,head_sha,status,run_attempt}]' > "$out/queued.json"
          cd "$out"
          sha256sum source.tar.gz source-tree.txt source-commit.txt frozen-source-tree.json formal-to-passive.json refs.json evidence-tree.json pr-comments.jsonl pr.json running.json queued.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passive-audit-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/passive-audit-inputs/
          retention-days: 90
          if-no-files-found: error
