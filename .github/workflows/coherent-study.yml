name: Filled-account ownership evidence
on:
  push:
    branches: [research/expectation-learning]
    paths:
      - research/coherent-request.json
permissions:
  contents: write
concurrency:
  group: coherent-filled-account-study
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src:tests:.
      QUANT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact source before validation
        run: |
          mkdir -p "$RUNNER_TEMP/coherent"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/coherent/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/coherent/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/coherent/source-tree.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install frozen research runtime
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 -r research/requirements.txt
      - name: Verify offline and forecast ownership contracts
        run: |
          python -m unittest discover -s tests -q > "$RUNNER_TEMP/coherent/correctness.txt" 2>&1
          python -m unittest research.test_coherent research.test_coherent_evidence -v >> "$RUNNER_TEMP/coherent/correctness.txt" 2>&1
      - name: Compare only the two preregistered ownership candidates
        timeout-minutes: 6
        run: |
          python - <<'PYRUN' > "$RUNNER_TEMP/coherent/execution.txt" 2>&1
          import hashlib, json, os, pathlib, shutil, subprocess, sys, time, urllib.error, urllib.request
          from research.hosted_study import inputs
          from research.coherent_study import ARCHIVE_SHA256
          from research.coherent import grid
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          request = json.loads(pathlib.Path('research/coherent-request.json').read_text())
          if len(grid()) != request['candidate_count'] or request['parent_archive_sha256'] != ARCHIVE_SHA256:
              raise ValueError('preregistered request identity mismatch')
          url = ('https://raw.githubusercontent.com/ychenracing/quant/' + request['evidence_commit'] + '/'
                 + request['parent_archive_path'])
          parent = root / 'issued-parent.tar.gz'
          temporary = parent.with_suffix('.partial')
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=45) as response, temporary.open('wb') as target:
                      shutil.copyfileobj(response, target)
                  if hashlib.sha256(temporary.read_bytes()).hexdigest() != ARCHIVE_SHA256:
                      raise ValueError('parent archive hash mismatch')
                  temporary.replace(parent)
                  break
              except (OSError, ValueError):
                  temporary.unlink(missing_ok=True)
                  if attempt == 2: raise
                  time.sleep(attempt + 1)
          data, supplement = inputs(root / 'frozen-input')
          subprocess.run([sys.executable, '-m', 'research.coherent_study', '--data', str(data),
                          '--supplement', str(supplement), '--parent-archive', str(parent),
                          '--output', str(root / 'coherent')], check=True)
          PYRUN
      - name: Package every outcome without claiming acceptance
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = root / 'coherent'
          output.mkdir(exist_ok=True)
          request = json.loads(pathlib.Path('research/coherent-request.json').read_text())
          selection = output / 'selection/selection.json'
          selected = json.loads(selection.read_text()) if selection.exists() else {}
          receipt = {'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'family': request['family'], 'selection_status': selected.get('status', 'INCOMPLETE'),
                     'economic_acceptance': 'NOT_PASSED' if selected.get('worst_deficit', 0) > 1e-12 else 'UNVERIFIED',
                     'evaluation_present': (output / 'evaluation/status.json').exists()}
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          manifest = {str(p.relative_to(output)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(output.rglob('*')) if p.is_file() and p.name != 'MANIFEST.json'}
          (output / 'MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n')
          archive = root / 'coherent-evidence.tar.gz'
          with tarfile.open(archive, 'w:gz') as bundle:
              bundle.add(output, arcname='coherent')
          (root / 'coherent-evidence.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  coherent-evidence.tar.gz\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coherent-${{ github.sha }}
          path: |
            ${{ runner.temp }}/coherent-evidence.tar.gz
            ${{ runner.temp }}/coherent-evidence.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Append and read back immutable evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/coherent-evidence.tar.gz"
          gh auth setup-git
          git clone --depth=1 --branch research/evidence "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/evidence-store"
          cd "$RUNNER_TEMP/evidence-store"
          destination="coherent/$GITHUB_SHA/$GITHUB_RUN_ID"
          test ! -e "$destination"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/coherent-evidence.tar.gz" "$RUNNER_TEMP/coherent-evidence.sha256" "$destination/"
          for file in receipt.json failure.json MANIFEST.json correctness.txt parent_diagnosis_failure.json; do
            if [ -f "$RUNNER_TEMP/coherent/$file" ]; then cp "$RUNNER_TEMP/coherent/$file" "$destination/"; fi
          done
          for dir in selection evaluation parent_diagnosis; do
            if [ -d "$RUNNER_TEMP/coherent/$dir" ]; then
              mkdir -p "$destination/$dir"
              find "$RUNNER_TEMP/coherent/$dir" -maxdepth 1 -type f -exec cp {} "$destination/$dir/" \;
            fi
          done
          git config user.name 'quant research publisher'
          git config user.email 'quant-research@users.noreply.github.com'
          git add -- "$destination"
          git commit -m 'research: retain filled-account comparison and complete original outcomes'
          for attempt in 1 2 3; do
            if git push origin HEAD:research/evidence; then
              git fetch origin research/evidence
              expected=$(cut -d' ' -f1 "$RUNNER_TEMP/coherent-evidence.sha256")
              actual=$(git show "FETCH_HEAD:$destination/coherent-evidence.tar.gz" | sha256sum | cut -d' ' -f1)
              test "$actual" = "$expected"
              printf '%s\n' "Read-back verified $destination $actual" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git fetch origin research/evidence
            git rebase FETCH_HEAD
          done
          exit 1
