name: Research data acquisition
on:
  push:
    branches: [research/independent-tech]
    paths: [.github/workflows/research-data.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire required external comparator indices
        run: python research/download_reference_indices.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-comparator-index-data
          path: market-data/
          retention-days: 30
          if-no-files-found: error
