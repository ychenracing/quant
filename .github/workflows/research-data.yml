name: Explicit research reproduction
on:
  workflow_dispatch:
  push:
    branches: [research/causal-protection]
    paths: [research/run-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: causal-research-publication
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write
      actions: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install bounded research runtime
        run: python -m pip install ./source PyYAML==6.0.3
      - name: Restore the three frozen archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir archives
          python - <<'PY'
          import json, pathlib, subprocess
          request = json.loads(pathlib.Path('source/research/run-request.json').read_text())
          for name, record in request['archives'].items():
              with open('archives/' + name + '.zip', 'wb') as stream:
                  subprocess.run(['gh', 'api', 'repos/ychenracing/quant/actions/artifacts/' + str(record['artifact_id']) + '/zip'], stdout=stream, check=True)
          PY
      - name: Reproduce source-bound independent research
        env:
          QUANT_SOURCE_COMMIT: ${{ github.sha }}
          PYTHONPATH: source/src:source/tests:source
        run: |
          python -m unittest discover -s source/tests -v > engineering.txt 2>&1
          python source/research/replay_families.py --archives archives --output result
      - name: Prepare immutable publication
        run: |
          test -s result.tar.gz
          mkdir publication
          split -b 48M -d -a 3 result.tar.gz publication/evidence.tar.gz.part-
          cp result.receipt.json publication/receipt.json
          cp result/RUN_REPORT.md result/report.json result/SOURCE_IDENTITY.json result/MANIFEST.json publication/
          cp engineering.txt publication/
          (cd publication && sha256sum evidence.tar.gz.part-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causal-research-${{ github.sha }}
          path: |
            publication/
            result/execution.json
            result/*.log
            engineering.txt
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: incomplete-causal-research-${{ github.sha }}
          path: |
            result/
            engineering.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Append evidence without replacing another study's pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s publication/receipt.json
          gh auth setup-git
          git init -q evidence-store
          cd evidence-store
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin refs/heads/research/evidence; then
            git fetch --depth=1 origin research/evidence
            git checkout -b research/evidence FETCH_HEAD
          else
            git checkout --orphan research/evidence
          fi
          destination="causal/${GITHUB_SHA}/${GITHUB_RUN_ID}"
          test ! -e "$destination"
          mkdir -p "$destination"
          cp -a ../publication/. "$destination/"
          git config user.name 'quant research publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$destination"
          git commit -m "research: preserve causal measurements ${GITHUB_SHA}"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/research/evidence; then exit 0; fi
            git fetch origin research/evidence
            git rebase FETCH_HEAD
          done
          exit 1
