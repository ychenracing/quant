name: Research data acquisition
on:
  push:
    branches: [research/independent-tech]
    paths: [.github/workflows/research-data.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire and validate raw and adjusted prices
        run: python research/download_market.py --out market-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-quant-market-data
          path: market-data/
          retention-days: 30
          if-no-files-found: error
