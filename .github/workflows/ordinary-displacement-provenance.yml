name: Ordinary displacement provenance attribution
on:
  push:
    branches: [research/expectation-learning]
    paths:
      - .github/workflows/ordinary-displacement-provenance.yml
      - research/ordinary_displacement_provenance_attribution.py
permissions:
  contents: write
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONPATH: src:tests:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      QUANT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 -r research/requirements.txt
      - name: Run provenance attribution
        timeout-minutes: 6
        run: |
          mkdir -p "$RUNNER_TEMP/provenance-attribution"
          python - <<'PY'
          import os,pathlib
          from research.hosted_study import inputs
          root=pathlib.Path(os.environ['RUNNER_TEMP']); data,supplement=inputs(root/'frozen-input')
          output=root/'provenance-attribution/result.json'
          rc=os.system(f"python -m research.ordinary_displacement_provenance_attribution --data '{data}' --supplement '{supplement}' --output '{output}'")
          if rc or not output.exists(): raise SystemExit('provenance attribution failed')
          PY
      - name: Package outcome
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'provenance-attribution'; out.mkdir(exist_ok=True)
          (out/'receipt.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'status':'READ_ONLY_ATTRIBUTION','economic_acceptance':'NOT_APPLICABLE'},indent=2)+'\n')
          manifest={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='MANIFEST.json'}
          (out/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          archive=root/'provenance-attribution.tar.gz'
          with tarfile.open(archive,'w:gz') as bundle: bundle.add(out,arcname='provenance-attribution')
          (root/'provenance-attribution.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  provenance-attribution.tar.gz\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-attribution-${{ github.sha }}
          path: |
            ${{ runner.temp }}/provenance-attribution.tar.gz
            ${{ runner.temp }}/provenance-attribution.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Append and read back evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail; gh auth setup-git
          git clone --depth=1 --branch research/evidence "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/store"
          cd "$RUNNER_TEMP/store"; destination="provenance-attribution/$GITHUB_SHA/$GITHUB_RUN_ID"; test ! -e "$destination"; mkdir -p "$destination"
          cp "$RUNNER_TEMP/provenance-attribution.tar.gz" "$RUNNER_TEMP/provenance-attribution.sha256" "$destination/"
          cp "$RUNNER_TEMP/provenance-attribution"/*.json "$destination/" || true
          git config user.name 'quant research publisher'; git config user.email 'quant-research@users.noreply.github.com'; git add -- "$destination"; git commit -m 'research: retain recovered provenance attribution'
          for attempt in 1 2 3; do
            if git push origin HEAD:research/evidence; then
              git fetch origin research/evidence; expected=$(cut -d' ' -f1 "$RUNNER_TEMP/provenance-attribution.sha256"); actual=$(git show "FETCH_HEAD:$destination/provenance-attribution.tar.gz" | sha256sum | cut -d' ' -f1); test "$actual" = "$expected"; exit 0
            fi
            git fetch origin research/evidence; git rebase FETCH_HEAD
          done
          exit 1
