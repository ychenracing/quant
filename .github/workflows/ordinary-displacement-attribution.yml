name: Ordinary displacement state attribution
on:
  push:
    branches: [research/expectation-learning]
    paths:
      - .github/workflows/ordinary-displacement-attribution.yml
      - research/ordinary_displacement_state_attribution.py
permissions:
  contents: write
concurrency:
  group: ordinary-displacement-state-attribution
  cancel-in-progress: false
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONPATH: src:tests:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      QUANT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 -r research/requirements.txt
      - name: Run fixed read-only attribution
        timeout-minutes: 6
        run: |
          mkdir -p "$RUNNER_TEMP/displacement-attribution"
          python - <<'PY'
          import json, os, pathlib
          from research.hosted_study import inputs
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          data,supplement=inputs(root/'frozen-input')
          os.system(f"python -m research.ordinary_displacement_state_attribution --data '{data}' --supplement '{supplement}' --output '{root/'displacement-attribution/result.json'}'")
          if not (root/'displacement-attribution/result.json').exists(): raise SystemExit('attribution output missing')
          PY
      - name: Package outcome
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'displacement-attribution'; out.mkdir(exist_ok=True)
          receipt={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                   'status':'READ_ONLY_ATTRIBUTION','economic_acceptance':'NOT_APPLICABLE'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          manifest={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='MANIFEST.json'}
          (out/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          archive=root/'displacement-attribution.tar.gz'
          with tarfile.open(archive,'w:gz') as bundle: bundle.add(out,arcname='displacement-attribution')
          (root/'displacement-attribution.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  displacement-attribution.tar.gz\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: displacement-attribution-${{ github.sha }}
          path: |
            ${{ runner.temp }}/displacement-attribution.tar.gz
            ${{ runner.temp }}/displacement-attribution.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Append and read back evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth=1 --branch research/evidence "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/store"
          cd "$RUNNER_TEMP/store"
          destination="displacement-attribution/$GITHUB_SHA/$GITHUB_RUN_ID"; test ! -e "$destination"; mkdir -p "$destination"
          cp "$RUNNER_TEMP/displacement-attribution.tar.gz" "$RUNNER_TEMP/displacement-attribution.sha256" "$destination/"
          cp "$RUNNER_TEMP/displacement-attribution"/*.json "$destination/" || true
          git config user.name 'quant research publisher'; git config user.email 'quant-research@users.noreply.github.com'
          git add -- "$destination"; git commit -m 'research: retain read-only displacement state attribution'
          for attempt in 1 2 3; do
            if git push origin HEAD:research/evidence; then
              git fetch origin research/evidence
              expected=$(cut -d' ' -f1 "$RUNNER_TEMP/displacement-attribution.sha256")
              actual=$(git show "FETCH_HEAD:$destination/displacement-attribution.tar.gz" | sha256sum | cut -d' ' -f1)
              test "$actual" = "$expected"; exit 0
            fi
            git fetch origin research/evidence; git rebase FETCH_HEAD
          done
          exit 1
