name: Reference rearm alpha evidence
on:
  push:
    branches: [research/expectation-learning]
    paths:
      - .github/workflows/reference-rearm-study.yml
      - research/offensive_reference_rearm.py
      - research/test_offensive_reference_rearm.py
      - research/offensive_reference_rearm_study.py
      - research/offensive_reference_rearm_contract.json
      - research/reference-rearm-request.json
permissions:
  contents: write
concurrency:
  group: reference-rearm-alpha-study
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src:tests:.
      QUANT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install frozen research runtime
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 -r research/requirements.txt
      - name: Focused reference-rearm contracts
        run: python -m unittest research.test_offensive_reference_rearm -v
      - name: Measure only when source-bound request exists
        if: hashFiles('research/reference-rearm-request.json') != ''
        timeout-minutes: 6
        run: |
          python - <<'PY' > "$RUNNER_TEMP/reference-rearm-execution.txt" 2>&1
          import json, os, pathlib, subprocess
          from research.hosted_study import inputs
          from research.offensive_reference_rearm_study import Study
          from techquant.data import load_market
          request=json.loads(pathlib.Path('research/reference-rearm-request.json').read_text())
          for path, expected in request['source_git_blob'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual != expected: raise SystemExit(f'git blob mismatch {path}: {actual} != {expected}')
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'reference-rearm'; out.mkdir(parents=True,exist_ok=True)
          data,supplement=inputs(root/'frozen-input')
          catalog=json.loads(pathlib.Path('research/catalog.json').read_text())
          market=load_market(data,supplement=supplement,sectors=catalog['sectors'])
          if market.fingerprint()!=request['data_sha256']: raise ValueError('frozen market identity mismatch')
          study=Study(request['family']); study.select(market,catalog,out/'selection')
          study.evaluate(market,catalog,out/'selection/selection.json',out/'evaluation')
          selection=json.loads((out/'selection/selection.json').read_text())
          (out/'receipt.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'family':request['family'],'selection_status':selection['status'],'economic_acceptance':'NOT_ESTABLISHED','evaluation_present':(out/'evaluation/status.json').exists()},indent=2)+'\n')
          PY
      - name: Package source-bound outcome
        if: always() && hashFiles('research/reference-rearm-request.json') != ''
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'reference-rearm'; out.mkdir(exist_ok=True)
          log=root/'reference-rearm-execution.txt'
          if log.exists(): (out/'execution.txt').write_bytes(log.read_bytes())
          for source,name in [(pathlib.Path('research/reference-rearm-request.json'),'request.json')]:
              if source.exists(): (out/name).write_bytes(source.read_bytes())
          manifest={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='MANIFEST.json'}
          (out/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          archive=root/'reference-rearm-evidence.tar.gz'
          with tarfile.open(archive,'w:gz') as bundle: bundle.add(out,arcname='reference-rearm')
          (root/'reference-rearm-evidence.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  reference-rearm-evidence.tar.gz\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('research/reference-rearm-request.json') != ''
        with:
          name: reference-rearm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference-rearm-evidence.tar.gz
            ${{ runner.temp }}/reference-rearm-evidence.sha256
          retention-days: 90
          if-no-files-found: error
