name: Positive alpha compounder evidence
on:
  push:
    branches: [research/expectation-learning]
    paths:
      - .github/workflows/positive-alpha-compounder-study.yml
      - research/offensive_positive_alpha_compounder.py
      - research/test_offensive_positive_alpha_compounder.py
      - research/offensive_positive_alpha_compounder_contract.json
      - research/offensive_positive_alpha_compounder_study.py
      - research/positive-alpha-compounder-request.json
permissions:
  contents: write
concurrency:
  group: positive-alpha-compounder-alpha
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONPATH: src:tests:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      QUANT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install frozen research runtime
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 -r research/requirements.txt
      - name: Candidate TDD contract
        run: python -m unittest research.test_offensive_positive_alpha_compounder -v
      - name: Measure only when source-bound request exists
        if: hashFiles('research/positive-alpha-compounder-request.json') != ''
        timeout-minutes: 6
        run: |
          python - <<'PY' > "$RUNNER_TEMP/positive-alpha-compounder-execution.txt" 2>&1
          import json, os, pathlib, subprocess
          from research.hosted_study import inputs
          from research.offensive_positive_alpha_compounder_study import Study
          from techquant.data import load_market
          request=json.loads(pathlib.Path('research/positive-alpha-compounder-request.json').read_text())
          for path,expected in request['source_git_blob'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual!=expected: raise SystemExit(f'git blob mismatch {path}: {actual} != {expected}')
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'positive-alpha-compounder'; out.mkdir(parents=True,exist_ok=True)
          data,supplement=inputs(root/'frozen-input'); catalog=json.loads(pathlib.Path('research/catalog.json').read_text()); market=load_market(data,supplement=supplement,sectors=catalog['sectors'])
          if market.fingerprint()!=request['data_sha256']: raise ValueError('frozen market identity mismatch')
          study=Study(request['family']); study.select(market,catalog,out/'selection'); study.evaluate(market,catalog,out/'selection/selection.json',out/'evaluation')
          selection=json.loads((out/'selection/selection.json').read_text())
          (out/'receipt.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'family':request['family'],'selection_status':selection['status'],'economic_acceptance':'NOT_ESTABLISHED','evaluation_present':(out/'evaluation/status.json').exists()},indent=2)+'\n')
          PY
      - name: Package source-bound outcome
        if: always() && hashFiles('research/positive-alpha-compounder-request.json') != ''
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'positive-alpha-compounder'; out.mkdir(exist_ok=True); log=root/'positive-alpha-compounder-execution.txt'
          if log.exists(): (out/'execution.txt').write_bytes(log.read_bytes())
          request=pathlib.Path('research/positive-alpha-compounder-request.json')
          if request.exists(): (out/'request.json').write_bytes(request.read_bytes())
          manifest={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='MANIFEST.json'}; (out/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          archive=root/'positive-alpha-compounder-evidence.tar.gz'
          with tarfile.open(archive,'w:gz') as bundle: bundle.add(out,arcname='positive-alpha-compounder')
          (root/'positive-alpha-compounder-evidence.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  positive-alpha-compounder-evidence.tar.gz\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('research/positive-alpha-compounder-request.json') != ''
        with:
          name: positive-alpha-compounder-${{ github.sha }}
          path: |
            ${{ runner.temp }}/positive-alpha-compounder-evidence.tar.gz
            ${{ runner.temp }}/positive-alpha-compounder-evidence.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Append and read back immutable evidence
        if: always() && hashFiles('research/positive-alpha-compounder-request.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/positive-alpha-compounder-evidence.tar.gz"
          gh auth setup-git
          git clone --depth=1 --branch research/evidence "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/positive-alpha-compounder-store"
          cd "$RUNNER_TEMP/positive-alpha-compounder-store"
          destination="positive-alpha-compounder/$GITHUB_SHA/$GITHUB_RUN_ID"; test ! -e "$destination"; mkdir -p "$destination"
          cp "$RUNNER_TEMP/positive-alpha-compounder-evidence.tar.gz" "$RUNNER_TEMP/positive-alpha-compounder-evidence.sha256" "$destination/"
          for file in receipt.json MANIFEST.json execution.txt request.json; do if [ -f "$RUNNER_TEMP/positive-alpha-compounder/$file" ]; then cp "$RUNNER_TEMP/positive-alpha-compounder/$file" "$destination/"; fi; done
          for dir in selection evaluation; do if [ -d "$RUNNER_TEMP/positive-alpha-compounder/$dir" ]; then mkdir -p "$destination/$dir"; find "$RUNNER_TEMP/positive-alpha-compounder/$dir" -maxdepth 1 -type f -exec cp {} "$destination/$dir/" \;; fi; done
          git config user.name 'quant research publisher'; git config user.email 'quant-research@users.noreply.github.com'; git add -- "$destination"; git commit -m 'research: retain positive alpha compounder evidence'
          for attempt in 1 2 3; do
            if git push origin HEAD:research/evidence; then git fetch origin research/evidence; expected=$(cut -d' ' -f1 "$RUNNER_TEMP/positive-alpha-compounder-evidence.sha256"); actual=$(git show "FETCH_HEAD:$destination/positive-alpha-compounder-evidence.tar.gz" | sha256sum | cut -d' ' -f1); test "$actual" = "$expected"; exit 0; fi
            git fetch origin research/evidence; git rebase FETCH_HEAD
          done
          exit 1
