name: Independent research evidence
on:
  push:
    branches: [research/expectation-learning]
    paths:
      - .github/workflows/independent-study.yml
      - research/hosted-request.json
permissions:
  contents: write
concurrency:
  group: independent-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: src
      QUANT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen numerical dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Necessary offline correctness
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -q
      - name: Reproduce finite studies and preserve every outcome
        run: python -m research.hosted_study --output "$RUNNER_TEMP/independent/evidence" --families expectation leadership admission
      - name: Persist full raw evidence and readable summaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/independent/research-evidence.tar.gz"
          if [ ! -f "$artifact" ]; then
            echo 'No research package was generated; no economic completion is asserted.'
            exit 1
          fi
          dest="research/results/hosted/$GITHUB_SHA/$GITHUB_RUN_ID"
          git fetch origin research/expectation-learning
          git checkout -B evidence-publication FETCH_HEAD
          mkdir -p "$dest"
          cp "$artifact" "$dest/research-evidence.tar.gz"
          cp "$RUNNER_TEMP/independent/research-evidence.sha256" "$dest/"
          cp "$RUNNER_TEMP/independent/evidence/receipt.json" "$dest/"
          cp "$RUNNER_TEMP/independent/evidence/MANIFEST.json" "$dest/"
          for family in expectation leadership admission; do
            for pair in selection/selection.json selection/trials.csv evaluation/matrix.csv; do
              source="$RUNNER_TEMP/independent/evidence/$family/$pair"
              if [ -f "$source" ]; then
                mkdir -p "$dest/$family/$(dirname "$pair")"
                cp "$source" "$dest/$family/$pair"
              fi
            done
          done
          git config user.name 'quant-research'
          git config user.email 'quant-research@users.noreply.github.com'
          git add "$dest"
          git commit -m 'research: preserve complete pinned raw evidence and identity receipt'
          git push origin HEAD:research/expectation-learning
          remote=$(git ls-remote origin refs/heads/research/expectation-learning | cut -f1)
          test "$remote" = "$(git rev-parse HEAD)"
          printf '%s\n' "Saved $dest at $remote" >> "$GITHUB_STEP_SUMMARY"
