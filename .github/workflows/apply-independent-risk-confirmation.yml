name: Apply independent risk confirmation

on:
  push:
    branches: [feat/dynamic-relative-risk-ownership]
    paths: [.github/workflows/apply-independent-risk-confirmation.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: src:tests:.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install exact candidate source
        run: python -m pip install -e .

      - name: Apply independent confirmation and verify
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/techquant/risk_ownership.py")
          text = source.read_text(encoding="utf-8")
          old = '''        channels = {
            "TREND": bool(self.trend_damage[i]),
            "BREADTH": bool(self.breadth_damage[i]),
            "VOLATILITY": bool(self.volatility_damage[i]),
            "ACCOUNT_ACCELERATION": account,
        }
        active = [name for name, enabled in channels.items() if enabled]
        defensive = len(active) >= 2
        crisis = bool(self.market_shock[i] and len(active) >= 1)
        return active, defensive, crisis, drawdown
'''
          new = '''        market_channels = {
            "TREND": bool(self.trend_damage[i]),
            "BREADTH": bool(self.breadth_damage[i]),
            "VOLATILITY": bool(self.volatility_damage[i]),
        }
        active_market = [
            name for name, enabled in market_channels.items() if enabled
        ]
        active = active_market + (["ACCOUNT_ACCELERATION"] if account else [])
        # Market structure must confirm the event independently.  Account loss
        # is path-dependent severity evidence, not a second vote for the same
        # price shock and never establishes protection by itself.
        defensive = len(active_market) >= 2
        crisis = bool(defensive and (self.market_shock[i] or account))
        return active, defensive, crisis, drawdown
'''
          if text.count(old) != 1:
              raise SystemExit("risk snapshot anchor mismatch")
          source.write_text(text.replace(old, new), encoding="utf-8")

          tests = Path("tests/test_risk_ownership.py")
          text = tests.read_text(encoding="utf-8")
          for old_line, new_line in (
              (
                  "        policy.trend_damage[10] = True\n        policy.strength[10] = np.array([3.0, 2.0, -3.0])\n",
                  "        policy.trend_damage[10] = True\n        policy.breadth_damage[10] = True\n        policy.strength[10] = np.array([3.0, 2.0, -3.0])\n",
              ),
              (
                  "        policy.market_shock[0] = True\n        policy.trend_damage[0] = True\n        units = np.array([150.0])\n",
                  "        policy.market_shock[0] = True\n        policy.trend_damage[0] = True\n        policy.breadth_damage[0] = True\n        units = np.array([150.0])\n",
              ),
          ):
              if text.count(old_line) != 1:
                  raise SystemExit("risk confirmation test anchor mismatch")
              text = text.replace(old_line, new_line)

          anchor = '''    def test_persistent_risk_reuses_one_absolute_protection_goal(self):
'''
          addition = '''    def test_account_loss_cannot_confirm_a_market_shock(self):
        market = sample_market(2, 20)
        policy = RiskAwareOwnershipPolicy(market, Config())
        policy.trend_damage[:] = False
        policy.breadth_damage[:] = False
        policy.volatility_damage[:] = False
        policy.market_shock[:] = False
        units = np.zeros(2)
        policy.decide(direct_observation(policy, 0, units, units, nav=100.0))
        policy.market_shock[1] = True

        decision = policy.decide(
            direct_observation(policy, 1, units, units, nav=80.0)
        )

        self.assertEqual(policy.state, "CAUTION")
        self.assertIn("SHOCK,ACCOUNT_ACCELERATION", decision.reason)
        self.assertNotIn("SYSTEMIC_PROTECTION", decision.reason)

    def test_persistent_risk_reuses_one_absolute_protection_goal(self):
'''
          if text.count(anchor) != 1:
              raise SystemExit("account severity regression anchor mismatch")
          tests.write_text(text.replace(anchor, addition), encoding="utf-8")

          screen = Path("research/risk_ownership_screen.py")
          text = screen.read_text(encoding="utf-8")
          old_metric = '''                        reasons.str.contains("FUNDED_RECOVERY_COMPLETE:", regex=False).sum()
'''
          new_metric = '''                        reasons.str.contains("FUNDED_RECOVERY_COMPLETE", regex=False).sum()
'''
          if text.count(old_metric) != 1:
              raise SystemExit("recovery metric anchor mismatch")
          screen.write_text(text.replace(old_metric, new_metric), encoding="utf-8")
          PY

          git diff --check
          python -m py_compile \
            src/techquant/risk_ownership.py \
            tests/test_risk_ownership.py \
            research/risk_ownership_screen.py
          python -m unittest discover -s tests -v
          python -m compileall -q src research
          python -m techquant --help >/dev/null

      - name: Commit verified independent confirmation
        run: |
          set -euo pipefail
          git config user.name "quant structural research"
          git config user.email "quant-research@users.noreply.github.com"
          git add -- \
            src/techquant/risk_ownership.py \
            tests/test_risk_ownership.py \
            research/risk_ownership_screen.py
          git commit -m "Require independent market risk confirmation"
          git push origin HEAD:feat/dynamic-relative-risk-ownership
