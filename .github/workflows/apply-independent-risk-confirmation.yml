name: Apply independent market confirmation

on:
  push:
    branches:
      - feat/dynamic-relative-risk-ownership
    paths:
      - research/apply_independent_confirmation.py
      - .github/workflows/apply-independent-risk-confirmation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: src:tests:.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install exact candidate source
        run: python -m pip install -e .

      - name: Apply deterministic migration
        run: python research/apply_independent_confirmation.py

      - name: Verify affected behavior
        run: |
          set -euo pipefail
          git diff --check
          python -m unittest tests.test_risk_ownership -v
          python -m unittest discover -s tests -v
          python -m compileall -q src research
          python -m techquant --help >/dev/null

      - name: Commit final source and remove migration scaffolding
        run: |
          set -euo pipefail
          git config user.name "quant structural research"
          git config user.email "quant-research@users.noreply.github.com"
          git rm -- \
            research/apply_independent_confirmation.py \
            .github/workflows/apply-independent-risk-confirmation.yml
          git add -- \
            src/techquant/risk_ownership.py \
            tests/test_risk_ownership.py \
            research/risk_ownership_screen.py
          git commit -m "Require independent market risk confirmation"
          git push origin HEAD:feat/dynamic-relative-risk-ownership
