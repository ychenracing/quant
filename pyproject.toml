[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techquant"
version = "1.0.0"
description = "Independent A-share technology research and auditable daily decision support"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.2.3"]

[project.scripts]
techquant = "techquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
